<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimório — Caderno do Mestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0f0c0a;
    --leather:#241a13;
    --leather-light:#33251b;
    --leather-lighter:#3f2d20;
    --parchment:#ecdfc2;
    --parchment-dim:#b7a488;
    --gold:#c9a24b;
    --gold-bright:#e9c977;
    --wax:#7a2b2b;
    --wax-dark:#4a1a1a;
    --rule:rgba(201,162,75,0.28);
    --font-display:'Cinzel Decorative', serif;
    --font-label:'Cinzel', serif;
    --font-body:'EB Garamond', serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2a1f16 0%, var(--void) 60%);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 16px) clamp(40px, 8vw, 80px);
    font-family:var(--font-body);
    color:var(--parchment);
  }

  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    z-index:999;
  }

  @media (prefers-reduced-motion: no-preference){
    .seal, .tile, .map-card{ transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  }

  :focus-visible{
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }

  /* ---------- tome (main panel) ---------- */
  .tome{
    width:100%;
    max-width:640px;
    background:
      linear-gradient(160deg, var(--leather) 0%, #1c140e 100%);
    border-radius:20px;
    border:1px solid rgba(201,162,75,0.35);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 0 60px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(0,0,0,0.4);
    padding:clamp(18px, 4.5vw, 30px) clamp(14px, 4vw, 28px) clamp(22px, 5vw, 34px);
    position:relative;
  }

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    padding-bottom:18px;
  }
  .sigil{
    width:52px;height:52px;flex:0 0 52px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 45%, var(--wax-dark) 100%);
    box-shadow: 0 0 0 3px var(--leather), 0 0 18px 2px rgba(201,162,75,0.35), inset 0 2px 3px rgba(255,255,255,0.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    color:var(--void);
    font-size:1.4rem;
  }
  .masthead h1{
    flex:1;
    text-align:center;
    margin:0;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.7rem, 6vw, 2.3rem);
    letter-spacing:0.03em;
    color:var(--parchment);
    text-shadow: 0 0 24px rgba(201,162,75,0.35);
  }
  .masthead .spacer{ width:52px; flex:0 0 52px; }
  .tagline{
    text-align:center;
    margin:-8px 0 18px;
    font-style:italic;
    color:var(--parchment-dim);
    font-size:0.9rem;
    letter-spacing:0.04em;
  }

  .rule{
    border:none;
    height:1px;
    margin:0 0 20px;
    background: linear-gradient(90deg, transparent, var(--rule) 20%, var(--rule) 80%, transparent);
    position:relative;
  }
  .rule::after{
    content:'✦';
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:var(--leather);
    color:var(--gold);
    font-size:0.7rem;
    padding:0 8px;
  }

  /* ---------- seals (buttons) ---------- */
  .seal{
    cursor:pointer;
    border:none;
    border-radius:50%;
    color:var(--gold-bright);
    background: radial-gradient(circle at 35% 30%, #935050, var(--wax) 55%, var(--wax-dark) 100%);
    box-shadow: 0 0 0 2px rgba(201,162,75,0.4), 0 4px 8px rgba(0,0,0,0.4);
    font-family:var(--font-display);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
    line-height:1;
  }
  .seal:hover{ transform:translateY(-1px); box-shadow:0 0 0 2px var(--gold-bright), 0 6px 12px rgba(0,0,0,0.5);}
  .seal:active{ transform:translateY(0px) scale(0.95); }
  .seal:disabled{ opacity:0.25; cursor:default; transform:none; box-shadow:0 0 0 2px rgba(201,162,75,0.2);}
  .seal--main{ width:clamp(34px, 8vw, 42px); height:clamp(34px, 8vw, 42px); font-size:clamp(1rem, 3vw, 1.2rem); }
  .seal--row{ width:clamp(26px, 6vw, 32px); height:clamp(26px, 6vw, 32px); font-size:clamp(0.85rem, 2.5vw, 1rem); }
  .seal--tiny{ width:24px;height:24px; font-size:0.75rem; }

  /* ---------- campaign selector ---------- */
  .campaign-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
  }
  .campaign-plate{
    flex:1;
    min-width:0;
    background: linear-gradient(180deg, var(--leather-lighter), var(--leather-light));
    border:1px solid var(--rule);
    border-radius:10px;
    padding:14px 12px;
    text-align:center;
    cursor:default;
  }
  .campaign-plate.is-new{ cursor:pointer; border-style:dashed; }
  .campaign-plate.is-new:hover{ background:var(--leather-lighter); }
  .campaign-plate__title{
    font-family:var(--font-display);
    font-size:1.05rem;
    letter-spacing:0.02em;
    color:var(--gold-bright);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .campaign-plate.is-new .campaign-plate__title{ color:var(--parchment-dim); font-family:var(--font-label); font-size:0.85rem; letter-spacing:0.08em; }

  /* ---------- chapters (rows) ---------- */
  .chapter{ margin-bottom:20px; }
  .chapter__label{
    font-family:var(--font-label);
    font-size:0.68rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px 2px;
  }
  .chapter__label::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--rule), transparent);
  }

  .row{ display:flex; align-items:center; gap:clamp(4px, 1.5vw, 8px); }
  .track{ flex:1; display:flex; gap:clamp(4px, 1.5vw, 8px); min-width:0; }

  .tile{
    flex:1 1 0;
    min-width:0;
    background:var(--leather-light);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:clamp(6px, 2vw, 10px);
    cursor:pointer;
  }
  .tile:hover{ background:var(--leather-lighter); }

  .tile--character{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; }
  .avatar{
    width:clamp(30px, 9vw, 38px);height:clamp(30px, 9vw, 38px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-label);
    font-weight:600;
    color:var(--void);
    font-size:0.9rem;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.3), 0 0 0 2px var(--leather-light);
    background-size:cover;
    background-position:center;
  }
  .avatar--photo{ cursor:zoom-in; }
  .pdf-badge{
    font-family:var(--font-label);
    font-size:0.6rem;
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    background:transparent;
    border:1px solid var(--rule);
    border-radius:5px;
    padding:2px 6px;
    cursor:pointer;
  }
  .pdf-badge:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .tile--character .name{ font-family:var(--font-label); font-size:clamp(0.62rem, 2vw, 0.75rem); letter-spacing:0.02em; color:var(--parchment); }

  .tile--chip .name{ font-family:var(--font-body); font-weight:600; font-size:clamp(0.72rem, 2.2vw, 0.85rem); color:var(--parchment); text-align:center; }

  .tile__desc{
    max-height:0;
    overflow:hidden;
    font-style:italic;
    color:var(--parchment-dim);
    font-size:0.78rem;
    line-height:1.35;
    transition:max-height .25s ease, margin-top .25s ease;
    margin-top:0;
  }
  .tile.is-open .tile__desc{ max-height:120px; margin-top:6px; }

  .tile--new{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-style:dashed;
    color:var(--parchment-dim);
    text-align:center;
    min-height:56px;
    gap:4px;
  }
  .tile--new .plus{ font-family:var(--font-display); font-size:1.1rem; color:var(--gold); line-height:1; }
  .tile--new .name{ font-family:var(--font-label); font-size:0.68rem; letter-spacing:0.07em; text-transform:uppercase; }

  /* inline create form */
  .create-form{ display:flex; flex-direction:column; gap:6px; }
  .create-form input{
    width:100%;
    background:var(--void);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:6px 8px;
    color:var(--parchment);
    font-family:var(--font-body);
    font-size:0.85rem;
  }
  .create-form input:focus{ border-color:var(--gold); }
  .create-form textarea{
    width:100%;
    background:var(--void);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:6px 8px;
    color:var(--parchment);
    font-family:var(--font-body);
    font-style:italic;
    font-size:0.8rem;
    resize:none;
  }
  .create-form textarea:focus{ border-color:var(--gold); }
  .create-form input[type="file"]{
    width:100%;
    font-size:0.7rem;
    color:var(--parchment-dim);
    padding:2px 0;
  }
  .create-form input[type="file"]::file-selector-button{
    font-family:var(--font-label);
    font-size:0.6rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid var(--rule);
    background:var(--leather-lighter);
    color:var(--parchment);
    border-radius:5px;
    padding:4px 8px;
    cursor:pointer;
    margin-right:6px;
  }
  .cf-file-field{ display:flex; flex-direction:column; gap:2px; }
  .cf-file-label{
    font-family:var(--font-label);
    font-size:0.58rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--parchment-dim);
  }
  .create-form .actions{ display:flex; gap:8px; justify-content:center; }
  .create-form button{
    font-family:var(--font-label);
    font-size:0.65rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border:none;
    border-radius:6px;
    padding:5px 10px;
    cursor:pointer;
  }
  .create-form .confirm{ background:var(--gold); color:var(--void); font-weight:600; }
  .create-form .cancel{ background:transparent; color:var(--parchment-dim); text-decoration:underline; padding:5px 4px; }

  /* ---------- bottom cells ---------- */
  .cells{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:24px;
  }
  .cell{
    background:var(--leather-light);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:14px;
    display:flex;
    flex-direction:column;
    min-height:170px;
  }
  .cell__label{
    font-family:var(--font-label);
    font-size:0.66rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  #anotacoes{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    color:var(--parchment);
    font-family:var(--font-body);
    font-style:italic;
    font-size:0.88rem;
    line-height:1.5;
  }
  #anotacoes::placeholder{ color:var(--parchment-dim); }

  .map-card{
    flex:1;
    border-radius:8px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    align-items:flex-end;
    min-height:80px;
  }
  .map-card__name{
    width:100%;
    padding:8px 10px;
    background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent);
    font-family:var(--font-label);
    font-size:0.75rem;
    letter-spacing:0.05em;
    color:var(--parchment);
  }
  .map-card.is-new{
    align-items:center;
    justify-content:center;
    border:1px dashed var(--rule);
  }
  .map-nav{ display:flex; justify-content:space-between; margin-top:8px; }

  .map-card.has-image{ cursor:zoom-in; }

  /* ---------- lightbox (ampliar / baixar) ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .lightbox[hidden]{ display:none; }
  .lightbox__backdrop{
    position:absolute;
    inset:0;
    background:rgba(10,7,5,0.86);
    backdrop-filter:blur(2px);
  }
  .lightbox__content{
    position:relative;
    max-width:min(92vw, 640px);
    max-height:90vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    background:var(--leather);
    border:1px solid rgba(201,162,75,0.4);
    border-radius:16px;
    padding:20px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.8);
  }
  .lightbox__body{
    display:flex;
    align-items:center;
    justify-content:center;
    max-width:100%;
    max-height:65vh;
    overflow:auto;
  }
  .lightbox__img{
    max-width:100%;
    max-height:65vh;
    border-radius:8px;
    display:block;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .lightbox__pdf{
    width:min(80vw, 560px);
    height:60vh;
    border:1px solid var(--rule);
    border-radius:8px;
    background:#fff;
  }
  .lightbox__close{
    position:absolute;
    top:10px; right:10px;
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--rule);
    background:var(--leather-light);
    color:var(--parchment);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
  }
  .lightbox__close:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .lightbox__caption{
    font-family:var(--font-label);
    font-size:0.85rem;
    letter-spacing:0.03em;
    color:var(--gold-bright);
    text-align:center;
  }
  .lightbox__download{
    font-family:var(--font-label);
    font-size:0.7rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--void);
    font-weight:600;
    border:none;
    border-radius:8px;
    padding:8px 18px;
    cursor:pointer;
  }
  .lightbox__download:hover{ background:var(--gold-bright); }
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<main class="tome">
  <div class="masthead">
    <div class="sigil">G</div>
    <h1>Grimório</h1>
    <div class="spacer"></div>
  </div>
  <p class="tagline">o caderno de quem conduz a mesa</p>
  <hr class="rule">

  <div class="campaign-nav">
    <button class="seal seal--main" id="btnCampPrev" aria-label="Campanha anterior">‹</button>
    <div class="campaign-plate" id="campaignPlate"></div>
    <button class="seal seal--main" id="btnCampNext" aria-label="Próxima campanha">›</button>
  </div>

  <div class="chapter">
    <p class="chapter__label">Personagens</p>
    <div class="row">
      <button class="seal seal--row" data-prev="personagens" aria-label="Personagens anteriores">‹</button>
      <div class="track" id="track-personagens"></div>
      <button class="seal seal--row" data-next="personagens" aria-label="Próximos personagens">›</button>
    </div>
  </div>

  <div class="chapter">
    <p class="chapter__label">Mecânicas</p>
    <div class="row">
      <button class="seal seal--row" data-prev="mecanicas" aria-label="Mecânicas anteriores">‹</button>
      <div class="track" id="track-mecanicas"></div>
      <button class="seal seal--row" data-next="mecanicas" aria-label="Próximas mecânicas">›</button>
    </div>
  </div>

  <div class="chapter">
    <p class="chapter__label">Magias</p>
    <div class="row">
      <button class="seal seal--row" data-prev="magias" aria-label="Magias anteriores">‹</button>
      <div class="track" id="track-magias"></div>
      <button class="seal seal--row" data-next="magias" aria-label="Próximas magias">›</button>
    </div>
  </div>

  <div class="cells">
    <div class="cell">
      <p class="cell__label">Anotações</p>
      <textarea id="anotacoes" placeholder="Escreva aqui os segredos, ganchos e lembretes desta sessão..."></textarea>
    </div>
    <div class="cell">
      <p class="cell__label">Mapas</p>
      <div class="map-card" id="mapCard"></div>
      <div class="map-nav">
        <button class="seal seal--tiny" id="btnMapPrev" aria-label="Mapa anterior">‹</button>
        <button class="seal seal--tiny" id="btnMapNext" aria-label="Próximo mapa">›</button>
      </div>
    </div>
  </div>
</main>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
  <div class="lightbox__content">
    <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Fechar">×</button>
    <p class="lightbox__caption" id="lightboxCaption"></p>
    <div class="lightbox__body" id="lightboxBody"></div>
    <button type="button" class="lightbox__download" id="lightboxDownload">Baixar</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- estado (apenas em memória) ----------
  function newList(items, novoLabel){
    return items.concat([{ isNew:true, name: novoLabel }]);
  }

  var campaigns = [
    {
      name: "A Maldição de Ashfall",
      personagens: newList([
        { name:"Kael Thorne", desc:"Paladino caído em busca de redenção. Carrega uma espada que sussurra à noite." },
        { name:"Vex", desc:"Ladina tiefling, contrabandista de relíquias amaldiçoadas." },
        { name:"Irmã Orla", desc:"Clériga itinerante, última sobrevivente do convento de Ashfall." }
      ], "Novo Personagem"),
      mecanicas: newList([
        { name:"Sanidade", desc:"Testes de Sabedoria contra horrores cósmicos. Falha acumula pontos de Loucura." },
        { name:"Cinzas Vivas", desc:"Área afetada pela maldição impõe desvantagem em testes de Constituição." },
        { name:"Favor dos Mortos", desc:"Personagens podem barganhar com espíritos em troca de lembranças." }
      ], "Nova Mecânica"),
      magias: newList([
        { name:"Sussurro das Cinzas", desc:"Conjuração, 2º círculo — revela os últimos pensamentos de um morto recente." },
        { name:"Véu de Ashfall", desc:"Ilusão, 3º círculo — encobre uma área em névoa cinzenta e silenciosa." },
        { name:"Chama Órfã", desc:"Evocação, 1º círculo — pequena chama que não se apaga no vento amaldiçoado." }
      ], "Nova Magia"),
      mapas: newList([
        { name:"Vila de Ashfall" },
        { name:"Cripta Afundada" }
      ], "Novo Mapa"),
      anotacoes:"Os jogadores ainda não descobriram que o prefeito está morto há três semanas."
    },
    {
      name: "Piratas do Mar Partido",
      personagens: newList([
        { name:"Capitã Rosalind Grey", desc:"Ex-corsária real, agora caçada pela própria coroa." },
        { name:"Bruk", desc:"Meio-orc timoneiro, supersticioso e leal até a morte." }
      ], "Novo Personagem"),
      mecanicas: newList([
        { name:"Reputação nos Portos", desc:"Cada porto reage de forma diferente à fama da tripulação." },
        { name:"Tempestades", desc:"Testes de Atletismo em grupo determinam dano ao navio." }
      ], "Nova Mecânica"),
      magias: newList([
        { name:"Chamado das Marés", desc:"Transmutação, 2º círculo — acalma ou agita as águas ao redor do navio." }
      ], "Nova Magia"),
      mapas: newList([
        { name:"Arquipélago Partido" }
      ], "Novo Mapa"),
      anotacoes:""
    },
    { isNew:true, name:"Criar Campanha" }
  ];

  var activeCampaign = 0;
  var winIndex = { personagens:0, mecanicas:0, magias:0 };
  var mapIndex = 0;

  var palette = ["#c9a24b","#8a6fae","#5c8f6b","#a25c5c","#5c85a2","#a2895c"];
  function hashColor(str){
    var h=0; for(var i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
    return palette[Math.abs(h) % palette.length];
  }
  function initials(name){
    var parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function windowSize(){ return 3; }

  function currentCampaign(){ return campaigns[activeCampaign]; }

  // ---------- lightbox (ampliar imagem/PDF + baixar) ----------
  var mimeExt = {
    "image/png":"png", "image/jpeg":"jpg", "image/jpg":"jpg", "image/gif":"gif",
    "image/webp":"webp", "image/svg+xml":"svg", "application/pdf":"pdf"
  };
  function extFromDataUrl(dataUrl){
    var m = /^data:([^;]+);/.exec(dataUrl || "");
    if(!m) return "arquivo";
    return mimeExt[m[1]] || (m[1].split("/")[1] || "arquivo");
  }
  function safeName(name){
    return String(name)
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-+|-+$)/g, "") || "arquivo";
  }
  function downloadDataUrl(dataUrl, filename){
    var a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function openLightbox(kind, dataUrl, caption, filename){
    if(!dataUrl) return;
    var box = document.getElementById("lightbox");
    var body = document.getElementById("lightboxBody");
    var captionEl = document.getElementById("lightboxCaption");
    body.innerHTML = "";
    captionEl.textContent = caption || "";
    if(kind === "pdf"){
      var embed = document.createElement("embed");
      embed.className = "lightbox__pdf";
      embed.src = dataUrl;
      embed.type = "application/pdf";
      body.appendChild(embed);
    } else {
      var img = document.createElement("img");
      img.className = "lightbox__img";
      img.src = dataUrl;
      img.alt = caption || "";
      body.appendChild(img);
    }
    document.getElementById("lightboxDownload").onclick = function(){ downloadDataUrl(dataUrl, filename); };
    box.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("lightboxClose").focus();
  }
  function closeLightbox(){
    var box = document.getElementById("lightbox");
    box.hidden = true;
    document.getElementById("lightboxBody").innerHTML = "";
    document.body.style.overflow = "";
  }
  document.getElementById("lightboxClose").onclick = closeLightbox;
  document.getElementById("lightboxBackdrop").onclick = closeLightbox;
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !document.getElementById("lightbox").hidden) closeLightbox();
  });

  // ---------- render ----------
  function renderAll(){
    renderCampaignPlate();
    renderList("personagens");
    renderList("mecanicas");
    renderList("magias");
    renderMap();
    var camp = currentCampaign();
    var ta = document.getElementById("anotacoes");
    ta.value = camp.isNew ? "" : (camp.anotacoes || "");
    ta.disabled = !!camp.isNew;
  }

  function renderCampaignPlate(){
    var camp = currentCampaign();
    var plate = document.getElementById("campaignPlate");
    plate.className = "campaign-plate" + (camp.isNew ? " is-new" : "");
    if(camp.isNew){
      plate.innerHTML = '<div class="campaign-plate__title">+ ' + escapeHtml(camp.name) + '</div>';
      plate.onclick = function(){ startCreateCampaign(plate); };
    } else {
      plate.innerHTML = '<div class="campaign-plate__title">' + escapeHtml(camp.name) + '</div>';
      plate.onclick = null;
    }
  }

  function getWindowItems(arr, start, size){
    if(arr.length <= size) return arr.slice();
    var out = [];
    for(var i=0;i<size;i++){ out.push(arr[(start+i) % arr.length]); }
    return out;
  }

  function renderList(type){
    var camp = currentCampaign();
    var arr = camp.isNew ? [{isNew:true, name:"Novo Item"}] : camp[type];
    var size = windowSize();
    var items = getWindowItems(arr, winIndex[type], size);
    var track = document.getElementById("track-" + type);
    track.innerHTML = "";
    items.forEach(function(item){
      track.appendChild(buildTile(item, type));
    });
    var prevBtn = document.querySelector('[data-prev="'+type+'"]');
    var nextBtn = document.querySelector('[data-next="'+type+'"]');
    var disable = camp.isNew || arr.length <= size;
    prevBtn.disabled = disable;
    nextBtn.disabled = disable;
  }

  function buildTile(item, type){
    var tile = document.createElement("div");
    if(item.isNew){
      tile.className = "tile tile--new";
      tile.innerHTML = '<span class="plus">+</span><span class="name">' + escapeHtml(item.name) + '</span>';
      tile.onclick = function(){ startCreateItem(tile, type); };
      return tile;
    }
    if(type === "personagens"){
      tile.className = "tile tile--character";

      var avatar = document.createElement("div");
      avatar.className = "avatar";
      if(item.photo){
        avatar.style.backgroundImage = "url(" + item.photo + ")";
        avatar.classList.add("avatar--photo");
        avatar.setAttribute("role", "button");
        avatar.setAttribute("aria-label", "Ampliar foto de " + item.name);
        avatar.onclick = function(e){
          e.stopPropagation();
          openLightbox("image", item.photo, item.name, safeName(item.name) + "." + extFromDataUrl(item.photo));
        };
      } else {
        avatar.style.background = hashColor(item.name);
        avatar.textContent = initials(item.name);
      }

      var nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = item.name;

      tile.appendChild(avatar);
      tile.appendChild(nameEl);

      if(item.pdf){
        var pdfBtn = document.createElement("button");
        pdfBtn.type = "button";
        pdfBtn.className = "pdf-badge";
        pdfBtn.textContent = "📄 Ficha";
        pdfBtn.setAttribute("aria-label", "Abrir ficha em PDF de " + item.name);
        pdfBtn.onclick = function(e){
          e.stopPropagation();
          openLightbox("pdf", item.pdf, item.name + " — Ficha", safeName(item.name) + "-ficha.pdf");
        };
        tile.appendChild(pdfBtn);
      }

      var descEl = document.createElement("div");
      descEl.className = "tile__desc";
      descEl.textContent = item.desc || "Sem descrição.";
      tile.appendChild(descEl);
    } else {
      tile.className = "tile tile--chip";
      tile.innerHTML =
        '<div class="name">' + escapeHtml(item.name) + '</div>' +
        '<div class="tile__desc">' + escapeHtml(item.desc || "") + '</div>';
    }
    tile.onclick = function(){ tile.classList.toggle("is-open"); };
    return tile;
  }

  function renderMap(){
    var camp = currentCampaign();
    var arr = camp.isNew ? [{isNew:true, name:"Novo Mapa"}] : camp.mapas;
    var item = arr[mapIndex % arr.length];
    var card = document.getElementById("mapCard");
    if(item.isNew){
      card.className = "map-card is-new";
      card.style.background = "transparent";
      card.innerHTML = '<span class="plus" style="font-family:var(--font-display);color:var(--gold);font-size:1.3rem;">+ ' + escapeHtml(item.name) + '</span>';
      card.onclick = function(){ startCreateMap(card); };
    } else {
      var hasImage = !!item.image;
      card.className = "map-card" + (hasImage ? " has-image" : "");
      if(hasImage){
        card.style.background = "url(" + item.image + ") center/cover no-repeat";
      } else {
        var c = hashColor(item.name);
        card.style.background =
          "repeating-radial-gradient(circle at 30% 30%, " + c + "22, " + c + "22 6px, transparent 7px, transparent 14px), " +
          "linear-gradient(135deg, #1c140e, #33251b)";
      }
      card.innerHTML = '<div class="map-card__name">' + escapeHtml(item.name) + '</div>';
      card.setAttribute("aria-label", hasImage ? "Ampliar mapa " + item.name : "Próximo mapa");
      card.onclick = hasImage
        ? function(){ openLightbox("image", item.image, item.name, safeName(item.name) + "." + extFromDataUrl(item.image)); }
        : function(){ mapIndex = (mapIndex + 1) % arr.length; renderMap(); };
    }
    document.getElementById("btnMapPrev").disabled = camp.isNew || arr.length <= 1;
    document.getElementById("btnMapNext").disabled = camp.isNew || arr.length <= 1;
  }

  // ---------- criação de itens ----------
  // Constrói um formulário inline a partir de uma lista de campos.
  // fields: [{ type:'text'|'textarea'|'file', name, placeholder, label, accept }]
  function buildCreateForm(fields, onConfirm, onCancel){
    var wrap = document.createElement("div");
    wrap.className = "create-form";
    var refs = {};
    fields.forEach(function(f){
      var el;
      if(f.type === "textarea"){
        el = document.createElement("textarea");
        el.placeholder = f.placeholder;
        el.rows = 2;
        el.maxLength = 300;
        refs[f.name] = el;
        wrap.appendChild(el);
      } else if(f.type === "file"){
        el = document.createElement("input");
        el.type = "file";
        el.accept = f.accept || "image/*";
        refs[f.name] = el;
        if(f.label){
          var fieldWrap = document.createElement("div");
          fieldWrap.className = "cf-file-field";
          var labelEl = document.createElement("span");
          labelEl.className = "cf-file-label";
          labelEl.textContent = f.label;
          fieldWrap.appendChild(labelEl);
          fieldWrap.appendChild(el);
          wrap.appendChild(fieldWrap);
        } else {
          wrap.appendChild(el);
        }
      } else {
        el = document.createElement("input");
        el.type = "text";
        el.placeholder = f.placeholder;
        el.maxLength = 60;
        refs[f.name] = el;
        wrap.appendChild(el);
      }
    });
    var actions = document.createElement("div");
    actions.className = "actions";
    var confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.className = "confirm";
    confirmBtn.textContent = "Adicionar";
    var cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancelar";
    actions.appendChild(confirmBtn);
    actions.appendChild(cancelBtn);
    wrap.appendChild(actions);

    confirmBtn.onclick = function(e){ e.stopPropagation(); onConfirm(refs); };
    cancelBtn.onclick = function(e){ e.stopPropagation(); onCancel(); };
    wrap.onclick = function(e){ e.stopPropagation(); };
    wrap.addEventListener("keydown", function(e){
      if(e.key === "Escape") onCancel();
      if(e.key === "Enter" && e.target.tagName !== "TEXTAREA") confirmBtn.click();
    });

    return { el: wrap, refs: refs, focus: function(){ (refs.name || Object.values(refs)[0]).focus(); } };
  }

  // lê um <input type="file"> como dataURL; chama callback(null) se vazio
  function readImage(fileInput, callback){
    if(fileInput && fileInput.files && fileInput.files[0]){
      var reader = new FileReader();
      reader.onload = function(ev){ callback(ev.target.result); };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      callback(null);
    }
  }

  function startCreateItem(tile, type){
    tile.className = "tile tile--new";
    tile.onclick = null;
    tile.innerHTML = "";

    var fields = (type === "personagens")
      ? [
          { type:"text", name:"name", placeholder:"Nome..." },
          { type:"textarea", name:"desc", placeholder:"Descrição do personagem..." },
          { type:"file", name:"photo", label:"Foto (imagem)", accept:"image/*" },
          { type:"file", name:"pdf", label:"Ficha (PDF)", accept:"application/pdf" }
        ]
      : [
          { type:"text", name:"name", placeholder:"Título..." },
          { type:"textarea", name:"desc", placeholder:"Descrição..." }
        ];

    var form = buildCreateForm(fields, function(refs){
      var name = refs.name.value.trim();
      if(!name){ refs.name.focus(); return; }
      var desc = refs.desc ? refs.desc.value.trim() : "";
      if(refs.photo || refs.pdf){
        readImage(refs.photo, function(photoUrl){
          readImage(refs.pdf, function(pdfUrl){
            addItem(type, name, desc, photoUrl, pdfUrl);
          });
        });
      } else {
        addItem(type, name, desc, null, null);
      }
    }, function(){ renderList(type); });

    tile.appendChild(form.el);
    form.focus();
  }

  function addItem(type, name, desc, photo, pdf){
    var camp = currentCampaign();
    var arr = camp[type];
    var novoObj = (type === "personagens")
      ? { name:name, desc: desc || "Sem descrição.", photo: photo || null, pdf: pdf || null }
      : { name:name, desc: desc || "Sem descrição." };
    arr.splice(arr.length - 1, 0, novoObj);
    winIndex[type] = Math.max(0, arr.length - windowSize());
    renderList(type);
  }

  function startCreateMap(card){
    card.innerHTML = "";
    var fields = [
      { type:"text", name:"name", placeholder:"Nome do mapa..." },
      { type:"file", name:"image", label:"Imagem (opcional)", accept:"image/*" }
    ];
    var form = buildCreateForm(fields, function(refs){
      var name = refs.name.value.trim();
      if(!name){ refs.name.focus(); return; }
      readImage(refs.image, function(dataUrl){
        var camp = currentCampaign();
        var arr = camp.mapas;
        arr.splice(arr.length - 1, 0, { name:name, image: dataUrl || null });
        mapIndex = arr.length - 2;
        renderMap();
      });
    }, function(){ renderMap(); });

    card.appendChild(form.el);
    form.focus();
    card.onclick = function(e){ e.stopPropagation(); };
  }

  function startCreateCampaign(plate){
    plate.classList.add("is-new");
    plate.onclick = null;
    plate.innerHTML = "";
    var fields = [{ type:"text", name:"name", placeholder:"Nome da campanha..." }];
    var form = buildCreateForm(fields, function(refs){
      var val = refs.name.value.trim();
      if(!val) { refs.name.focus(); return; }
      var novaCampanha = {
        name: val,
        personagens: newList([], "Novo Personagem"),
        mecanicas: newList([], "Nova Mecânica"),
        magias: newList([], "Nova Magia"),
        mapas: newList([], "Novo Mapa"),
        anotacoes: ""
      };
      campaigns.splice(campaigns.length - 1, 0, novaCampanha);
      activeCampaign = campaigns.length - 2;
      winIndex = { personagens:0, mecanicas:0, magias:0 };
      mapIndex = 0;
      renderAll();
    }, function(){ renderCampaignPlate(); });

    plate.appendChild(form.el);
    form.focus();
    plate.onclick = function(e){ e.stopPropagation(); };
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ---------- navegação ----------
  document.getElementById("btnCampPrev").onclick = function(){
    activeCampaign = (activeCampaign - 1 + campaigns.length) % campaigns.length;
    winIndex = { personagens:0, mecanicas:0, magias:0 };
    mapIndex = 0;
    renderAll();
  };
  document.getElementById("btnCampNext").onclick = function(){
    activeCampaign = (activeCampaign + 1) % campaigns.length;
    winIndex = { personagens:0, mecanicas:0, magias:0 };
    mapIndex = 0;
    renderAll();
  };

  ["personagens","mecanicas","magias"].forEach(function(type){
    document.querySelector('[data-prev="'+type+'"]').onclick = function(){
      var camp = currentCampaign();
      var arr = camp.isNew ? [1] : camp[type];
      winIndex[type] = (winIndex[type] - 1 + arr.length) % arr.length;
      renderList(type);
    };
    document.querySelector('[data-next="'+type+'"]').onclick = function(){
      var camp = currentCampaign();
      var arr = camp.isNew ? [1] : camp[type];
      winIndex[type] = (winIndex[type] + 1) % arr.length;
      renderList(type);
    };
  });

  document.getElementById("btnMapPrev").onclick = function(){
    var camp = currentCampaign();
    var arr = camp.isNew ? [1] : camp.mapas;
    mapIndex = (mapIndex - 1 + arr.length) % arr.length;
    renderMap();
  };
  document.getElementById("btnMapNext").onclick = function(){
    var camp = currentCampaign();
    var arr = camp.isNew ? [1] : camp.mapas;
    mapIndex = (mapIndex + 1) % arr.length;
    renderMap();
  };

  document.getElementById("anotacoes").addEventListener("input", function(e){
    var camp = currentCampaign();
    if(!camp.isNew) camp.anotacoes = e.target.value;
  });

  renderAll();
})();
</script>
</body>
</html>
